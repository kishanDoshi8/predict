name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  web:
    name: Web typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  database:
    name: Database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      # Applies every migration in supabase/migrations to a fresh local database.
      - run: supabase db start
      - run: supabase test db
