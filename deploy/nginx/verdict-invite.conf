# Short invite links with rich previews: https://<your domain>/i/<code>
#
# People are redirected straight to the room's join page. Link-preview
# crawlers (WhatsApp, iMessage, Telegram...) get a page with the room's name
# and counts from the invite-preview Supabase function.
#
# 1. Copy verdict-invite-map.conf to /etc/nginx/conf.d/ (it defines
#    $is_link_preview_bot).
# 2. Paste this location block into the app's server { } block, next to the
#    rules from verdict-cache.conf, and replace YOUR-PROJECT-REF (twice) with
#    your Supabase project ref (Settings > General).
# 3. sudo nginx -t && sudo systemctl reload nginx
# See docs/deployment-caching.md ("Rich invite links").

location ^~ /i/ {
    # People: /i/F4C36D?ref=invite-link -> /rooms/F4C36D/join?ref=invite-link
    if ($is_link_preview_bot = 0) {
        rewrite ^/i/([A-Za-z0-9]+)/?$ /rooms/$1/join redirect;
    }

    # Crawlers: /i/F4C36D -> /functions/v1/invite-preview/F4C36D
    rewrite ^/i/(.*)$ /functions/v1/invite-preview/$1 break;
    proxy_pass https://YOUR-PROJECT-REF.supabase.co;
    proxy_ssl_server_name on;
    proxy_set_header Host YOUR-PROJECT-REF.supabase.co;

    # Lets the function build links back to this domain.
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Supabase labels function HTML with a sandboxing security policy (no
    # styles, no scripts, no redirects) and may call it plain text. The page
    # is ours, so serve it as normal HTML from this domain.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Content-Type;
    add_header Content-Type "text/html; charset=utf-8" always;
    add_header Cache-Control "public, max-age=300" always;
    proxy_hide_header Cache-Control;
}
