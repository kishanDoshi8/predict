<!doctype html>
<!-- Source for public/og-image.jpg, the link-preview image. Regenerate: node og/render.mjs -->
<!-- Same "receipt" language as the in-app share cards (src/features/share). -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Fira Code";
    src: url("../../../node_modules/@fontsource-variable/fira-code/files/fira-code-latin-wght-normal.woff2") format("woff2");
    font-weight: 300 700;
  }
  @font-face {
    font-family: "Big Shoulders Display";
    src: url("../../../node_modules/@fontsource-variable/big-shoulders-display/files/big-shoulders-display-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
  }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #09090b;
    display: flex; align-items: center; justify-content: center;
    font-family: "Fira Code", ui-monospace, monospace; color: #17181A;
  }
  .ticket { width: 1000px; transform: rotate(-1.5deg); filter: drop-shadow(0 24px 36px rgba(0,0,0,.55)); }
  .paper {
    background: #E9EBE6; padding: 44px 56px 36px;
    display: grid; grid-template-columns: 1fr 380px; gap: 0 48px; font-size: 26px; line-height: 1.35;
  }
  .head { grid-column: 1 / -1; display: flex; justify-content: space-between; font-weight: 700; }
  .cut { grid-column: 1 / -1; border-top: 3px dashed #5F625E; opacity: .7; margin: 20px 0 22px; }
  .invited { font-weight: 700; font-size: 28px; }
  .name { font-family: "Big Shoulders Display", sans-serif; font-weight: 800; font-size: 170px; line-height: .9; letter-spacing: -2px; color: #F0386B; margin-top: 6px; }
  .stub { border-left: 3px dashed #5F625E; padding-left: 40px; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
  .row { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; font-size: 24px; }
  .row b { margin-left: auto; }
  .dots { flex: 1; border-bottom: 4px dotted #5F625E; opacity: .6; transform: translateY(-7px); min-width: 16px; }
  .note { grid-column: 1; color: #5F625E; margin-top: 18px; font-size: 24px; }
  svg { display: block; width: 100%; height: 20px; }
</style>
</head>
<body>
  <div class="ticket">
    <div class="paper">
      <div class="head"><span>Admit one</span><span>Friends only</span></div>
      <div class="cut"></div>
      <div>
        <div class="invited">You're invited to</div>
        <div class="name">Verdict</div>
      </div>
      <div class="stub">
        <div class="row"><span>Entry</span><span class="dots"></span><b>free</b></div>
        <div class="row"><span>Stack</span><span class="dots"></span><b>same for all</b></div>
        <div class="row"><span>Winner</span><span class="dots"></span><b>top balance</b></div>
      </div>
      <div class="note">Prediction series for friends. Tap to join the room.</div>
    </div>
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polygon id="edge" fill="#E9EBE6"></polygon></svg>
  </div>
  <script>
    const teeth = 32, pts = [];
    for (let i = 0; i <= teeth * 2; i++) pts.push(`${(i / (teeth * 2)) * 100},${i % 2 ? 100 : 0}`);
    document.getElementById("edge").setAttribute("points", `0,0 ${pts.join(" ")} 100,0`);
  </script>
</body>
</html>
