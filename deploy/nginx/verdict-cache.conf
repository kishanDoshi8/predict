# Caching rules for the Verdict web app (apps/web/dist).
#
# Paste these location blocks into the app's server { } block in
# /etc/nginx/sites-available/<your site>, replacing the existing
# `location / { ... }`. Then: sudo nginx -t && sudo systemctl reload nginx
# See docs/deployment-caching.md for the full steps.
#
# Note: a location with its own add_header drops server-level add_header
# lines. If your server block sets other headers (e.g. security headers),
# repeat them inside these locations.

# Hashed bundles never change once built: keep them for a year.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# The page, service worker, manifest and version file must always be checked
# with the server first, so phones never open an old build. "no-cache" means
# "revalidate", which costs a tiny 304 when nothing changed.
location ~* ^/(index\.html|sw\.js|version\.json|manifest\.json|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

# App routes (/rooms/..., /login, ...) are served by index.html, which picks
# up the no-cache header from the block above.
location / {
    try_files $uri $uri/ /index.html;
}
