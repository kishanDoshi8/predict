project_id = "kizogptkryjjxzlixtqp"   # replace with your Supabase project ref

[api]
port = 54321

[db]
port = 54322

[studio]
port = 54323

[inbucket]
port = 54324

[storage]
enabled = false   # not needed for this app

[auth]
enabled = false   # we handle identity via tokens, no Supabase Auth needed

[realtime]
enabled = true

[functions.send-push-notifications]
verify_jwt = true

[db.migrations]
schema_paths = [
  "./supabase/schemas/_global/*.sql",
  "./supabase/schemas/**/tables/*.sql",
  "./supabase/schemas/**/functions/*.sql",
  "./supabase/schemas/**/policies/*.sql",
  "./supabase/schemas/**/triggers/*.sql",
  "./supabase/schemas/**/views/*.sql"
]
