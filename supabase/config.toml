project_id = "kizogptkryjjxzlixtqp"

[api]
port = 54321

[db]
port = 54322

[studio]
port = 54323

[inbucket]
port = 54324

[storage]
enabled = false

[auth]
enabled = true

# Google sign-in for local development (see docs/google-sign-in.md).
# Production is configured in the Supabase dashboard, not here.
# [auth.external.google]
# enabled = true
# client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
# secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
# skip_nonce_check = true

[realtime]
enabled = true

[functions.send-push-notifications]
verify_jwt = true

# Public: serves link previews for /i/<code> invite links (no sign-in).
[functions.invite-preview]
verify_jwt = false

[db.migrations]
schema_paths = [
  "./schemas/_global/*.sql",
  "./schemas/**/tables/*.sql",
  "./schemas/**/functions/*.sql",
  "./schemas/**/policies/*.sql",
  "./schemas/**/triggers/*.sql",
  "./schemas/**/views/*.sql"
]
