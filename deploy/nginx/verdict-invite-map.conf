# Tells link-preview crawlers apart from people, for the /i/ invite links.
#
# Copy this file to /etc/nginx/conf.d/verdict-invite-map.conf (nginx loads it
# inside its http { } block). Keep the list in sync with PREVIEW_BOT in
# supabase/functions/invite-preview/index.ts.
# iMessage previews identify as facebookexternalhit / Twitterbot.

map $http_user_agent $is_link_preview_bot {
    default 0;
    "~*(facebookexternalhit|facebot|whatsapp|twitterbot|telegrambot|slackbot|discordbot|linkedinbot|skypeuripreview|applebot|googlebot|bingbot|embedly|pinterest|redditbot|vkshare|iframely|mastodon)" 1;
}
