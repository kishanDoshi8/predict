# Short invite links with rich previews: https://<your domain>/i/<code>
#
# Paste this location block into the app's server { } block, next to the
# rules from verdict-cache.conf, and replace YOUR-PROJECT-REF (twice) with
# your Supabase project ref (Settings > General). Then:
#   sudo nginx -t && sudo systemctl reload nginx
# See docs/deployment-caching.md ("Rich invite links").

location ^~ /i/ {
    # /i/F4C36D?ref=invite-link -> /functions/v1/invite-preview/F4C36D?ref=invite-link
    rewrite ^/i/(.*)$ /functions/v1/invite-preview/$1 break;
    proxy_pass https://YOUR-PROJECT-REF.supabase.co;
    proxy_ssl_server_name on;
    proxy_set_header Host YOUR-PROJECT-REF.supabase.co;

    # Lets the function build links back to this domain.
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Supabase may label HTML from functions as plain text; chat apps need
    # text/html to read the preview tags.
    proxy_hide_header Content-Type;
    add_header Content-Type "text/html; charset=utf-8" always;
    add_header Cache-Control "public, max-age=300" always;
    proxy_hide_header Cache-Control;
}
